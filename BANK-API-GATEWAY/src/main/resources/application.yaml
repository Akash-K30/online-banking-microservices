server:
  port: 8080
spring:
  application:
    name: BANK-API-GATEWAY

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**

            - id: account-service
              uri: lb://ACCOUNT-SERVICE
              predicates:
                - Path=/accounts/**

            - id: transaction-service
              uri: lb://TRANSACTION-SERVICE
              predicates:
                - Path=/transfer/**,/transactions/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/